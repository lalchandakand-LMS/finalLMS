name: Signed LMS Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: signed-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Verify exact tagged source before release
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: aloms_lms_release_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, ctype, fileinfo, mbstring, openssl, pdo_mysql, tokenizer, xml
          coverage: none
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: cp deployment/.env.example .env
      - run: php artisan key:generate --force
      - name: Run migrations
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: aloms_lms_release_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan migrate:fresh --force
      - name: Run automated tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: aloms_lms_release_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: vendor/bin/phpunit
      - run: php artisan route:list
      - run: npm run build

  release:
    name: Build, sign and publish immutable cPanel release
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate release tag and signing secret
        env:
          RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag must use vMAJOR.MINOR.PATCH."; exit 1; }
          test -n "$RELEASE_SIGNING_PRIVATE_KEY" || { echo "Missing RELEASE_SIGNING_PRIVATE_KEY repository Actions secret. See docs/RELEASE_SIGNING_SETUP.md."; exit 1; }

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, ctype, fileinfo, mbstring, openssl, pdo_mysql, tokenizer, xml
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      - name: Install production dependencies and build assets
        run: |
          set -euo pipefail
          cp deployment/.env.example .env
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
          php artisan key:generate --force
          php artisan config:cache
          php artisan view:cache
          npm ci
          npm run build

      - name: Assemble clean cPanel release package
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cpanel-package" dist
          VERSION="${GITHUB_REF_NAME#v}"
          printf '%s\n' "$VERSION" > VERSION
          rsync -a \
            --exclude='database/*.sqlite' \
            --exclude='storage/logs/*' \
            --exclude='storage/framework/cache/data/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            --exclude='storage/framework/testing/*' \
            --exclude='bootstrap/cache/*.php' \
            --exclude='tests' \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='dist' \
            app artisan bootstrap config database deployment public resources routes storage vendor composer.json composer.lock README.md VERSION \
            "$RUNNER_TEMP/cpanel-package/"
          (cd "$RUNNER_TEMP/cpanel-package" && zip -qr "$GITHUB_WORKSPACE/dist/AlomsEnglishCenter-cpanel.zip" .)
          unzip -t dist/AlomsEnglishCenter-cpanel.zip
          unzip -Z1 dist/AlomsEnglishCenter-cpanel.zip > "$RUNNER_TEMP/cpanel-files.txt"
          if grep -Eq '(^|/)(\.env|database\.sqlite|laravel\.log|\.git)(/|$)' "$RUNNER_TEMP/cpanel-files.txt"; then echo "Forbidden runtime or secret file found in release package."; exit 1; fi
          grep -Fxq 'public/index.php' "$RUNNER_TEMP/cpanel-files.txt"
          grep -Fxq 'vendor/autoload.php' "$RUNNER_TEMP/cpanel-files.txt"
          grep -Fxq 'deployment/.env.example' "$RUNNER_TEMP/cpanel-files.txt"

      - name: Create signed release manifest
        env:
          RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE="dist/AlomsEnglishCenter-cpanel.zip"
          PACKAGE_SHA="$(sha256sum "$PACKAGE" | awk '{print $1}')"
          MIGRATION_SHA="$(find database/migrations -maxdepth 1 -type f -name '*.php' -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          printf '%s' "$RELEASE_SIGNING_PRIVATE_KEY" > "$RUNNER_TEMP/release-private.pem"
          chmod 600 "$RUNNER_TEMP/release-private.pem"
          openssl pkey -in "$RUNNER_TEMP/release-private.pem" -check -noout
          openssl pkey -in "$RUNNER_TEMP/release-private.pem" -pubout -out dist/release-public.pem
          PUBKEY_FINGERPRINT="$(openssl pkey -pubin -in dist/release-public.pem -outform DER | sha256sum | awk '{print $1}')"
          jq -n \
            --arg product "aloms-english-center-lms" \
            --arg version "$VERSION" \
            --arg channel "stable" \
            --arg commit "$GITHUB_SHA" \
            --arg package "AlomsEnglishCenter-cpanel.zip" \
            --arg sha "$PACKAGE_SHA" \
            --arg migration_sha "$MIGRATION_SHA" \
            --arg fingerprint "$PUBKEY_FINGERPRINT" \
            --arg published_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg artifact_url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/AlomsEnglishCenter-cpanel.zip" \
            '{
              product: $product,
              version: $version,
              release_channel: $channel,
              git_commit: $commit,
              minimum_php: "8.3.0",
              laravel_major: 12,
              required_extensions: ["bcmath","ctype","fileinfo","mbstring","openssl","pdo_mysql","tokenizer","xml"],
              package_file: $package,
              package_sha256: $sha,
              migration_set_sha256: $migration_sha,
              signing_public_key_sha256: $fingerprint,
              published_at: $published_at,
              artifact_url: $artifact_url
            }' > dist/release-manifest.json
          openssl dgst -sha256 -sign "$RUNNER_TEMP/release-private.pem" -out dist/release-manifest.sig dist/release-manifest.json
          openssl dgst -sha256 -verify dist/release-public.pem -signature dist/release-manifest.sig dist/release-manifest.json
          printf '%s  %s\n' "$PACKAGE_SHA" "AlomsEnglishCenter-cpanel.zip" > dist/package.sha256
          rm -f "$RUNNER_TEMP/release-private.pem"

      - name: Verify package against signed manifest before publication
        run: |
          set -euo pipefail
          openssl dgst -sha256 -verify dist/release-public.pem -signature dist/release-manifest.sig dist/release-manifest.json
          EXPECTED="$(jq -r '.package_sha256' dist/release-manifest.json)"
          ACTUAL="$(sha256sum dist/AlomsEnglishCenter-cpanel.zip | awk '{print $1}')"
          test "$EXPECTED" = "$ACTUAL"

      - name: Publish GitHub release and signed assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            dist/AlomsEnglishCenter-cpanel.zip \
            dist/release-manifest.json \
            dist/release-manifest.sig \
            dist/release-public.pem \
            dist/package.sha256 \
            --title "Alom's English Center LMS $GITHUB_REF_NAME" \
            --generate-notes
