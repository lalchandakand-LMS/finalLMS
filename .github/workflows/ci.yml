name: Laravel CI

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: aloms_lms_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: aloms_lms_mariadb_test
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v5
      - name: Lint GitHub Actions workflows
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "actionlint dependency download failed; retrying ($attempt/3)..."
              sleep 5
            fi
          done
          echo "actionlint failed after three attempts."
          exit 1
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, ctype, fileinfo, mbstring, openssl, sodium, pdo_mysql, pdo_sqlite, sqlite3, tokenizer, xml, zip
          coverage: none
      - name: Lint PHP source files
        run: |
          find app bootstrap config database plugins public routes tests .github/scripts -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l artisan
      - name: Set up Python for PHP security analysis
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check semgrep
      - name: Scan PHP application and plugin code
        run: >-
          semgrep scan
          --config p/php
          --config p/security-audit
          --include '*.php'
          --exclude vendor
          --exclude node_modules
          --exclude storage
          --exclude bootstrap/cache
          --error
          --metrics=off
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - name: Audit Composer dependencies for known security advisories
        run: composer audit --no-interaction
      - run: npm ci
      - name: Audit production npm dependencies for high-severity advisories
        run: npm audit --omit=dev --audit-level=high
      - run: cp deployment/.env.example .env
      - run: php artisan key:generate --force
      - name: Run migrations
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: aloms_lms_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan migrate:fresh --force
      - name: Run tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: aloms_lms_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: vendor/bin/phpunit
      - name: Verify SQLite plugin routes and negative-marking rollback safety
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: |
          vendor/bin/phpunit tests/Unit/PluginContextTest.php
          vendor/bin/phpunit tests/Feature/FlashSaleTest.php
          vendor/bin/phpunit tests/Feature/ExaminationWorkflowTest.php --filter=test_negative_marking_migration_refuses_rollback_without_changing_recorded_negative_scores
      - name: Verify MariaDB negative-marking migration rollback safety
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3307
          DB_DATABASE: aloms_lms_mariadb_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          php artisan migrate:fresh --force
          vendor/bin/phpunit tests/Feature/ExaminationWorkflowTest.php --filter=test_negative_marking_migration_refuses_rollback_without_changing_recorded_negative_scores
      - run: php artisan route:list
      - run: npm run build
      - name: Prepare isolated browser-test database
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS aloms_lms_browser_test"
          DB_DATABASE=aloms_lms_browser_test php artisan migrate:fresh --force
      - name: Clear cached Laravel bootstrap before browser smoke tests
        run: php artisan optimize:clear
      - name: Start Laravel browser-test server
        env:
          APP_ENV: testing
          APP_DEBUG: 'false'
          APP_INSTALLED: 'true'
          APP_URL: http://127.0.0.1:8000
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: aloms_lms_browser_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > "$RUNNER_TEMP/lms-browser-server.log" 2>&1 &
          for attempt in $(seq 1 30); do
            status="$(curl --silent --show-error --output "$RUNNER_TEMP/lms-health-response.txt" --write-out '%{http_code}' --max-time 5 http://127.0.0.1:8000/up || true)"
            if [ "$status" = "200" ]; then exit 0; fi
            if [ "$attempt" -eq 30 ]; then
              echo "Laravel liveness probe failed; last HTTP status: ${status:-no-response}"
              echo "--- browser server output ---"
              cat "$RUNNER_TEMP/lms-browser-server.log"
              echo "--- liveness response body ---"
              cat "$RUNNER_TEMP/lms-health-response.txt" 2>/dev/null || true
              if [ -f storage/logs/laravel.log ]; then
                echo "--- Laravel application log (last 100 lines) ---"
                tail -n 100 storage/logs/laravel.log
              fi
              exit 1
            fi
            sleep 2
          done
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false @playwright/test
          npx playwright install --with-deps chromium
      - name: Run mobile and desktop browser smoke tests
        run: npx playwright test tests/browser/responsive-smoke.spec.cjs --reporter=line

  package:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, ctype, fileinfo, mbstring, openssl, sodium, pdo_mysql, tokenizer, xml
          coverage: none
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
      - run: cp deployment/.env.example .env
      - run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
      - run: php artisan key:generate --force
      - run: php artisan config:cache
      - name: Verify packaged LMS version marker
        run: EXPECTED_VERSION="$(tr -d '\r\n' < VERSION)" php .github/scripts/assert-release-version.php
      - run: php artisan view:cache
      - run: npm ci
      - run: npm run build
      - name: Assemble and verify cPanel ZIP
        run: |
          mkdir -p "$RUNNER_TEMP/cpanel-package" dist
          rsync -a \
            --exclude='database/*.sqlite' \
            --exclude='storage/logs/*' \
            --exclude='storage/framework/cache/data/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            --exclude='storage/framework/testing/*' \
            --exclude='bootstrap/cache/*.php' \
            --exclude='tests' \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='dist' \
            app artisan bootstrap config database deployment plugins public resources routes storage vendor composer.json composer.lock README.md VERSION \
            "$RUNNER_TEMP/cpanel-package/"
          (cd "$RUNNER_TEMP/cpanel-package" && zip -qr "$GITHUB_WORKSPACE/dist/AlomsEnglishCenter-cpanel.zip" .)
          unzip -t dist/AlomsEnglishCenter-cpanel.zip
          unzip -Z1 dist/AlomsEnglishCenter-cpanel.zip > "$RUNNER_TEMP/cpanel-files.txt"
          if grep -Eq '(^|/)(\.env|database\.sqlite|laravel\.log|\.git)(/|$)' "$RUNNER_TEMP/cpanel-files.txt"; then echo "Forbidden runtime or secret file found in release package."; exit 1; fi
          grep -Fxq 'public/index.php' "$RUNNER_TEMP/cpanel-files.txt"
          grep -Fxq 'vendor/autoload.php' "$RUNNER_TEMP/cpanel-files.txt"
          grep -Fxq 'VERSION' "$RUNNER_TEMP/cpanel-files.txt"
          grep -Fxq 'plugins/.htaccess' "$RUNNER_TEMP/cpanel-files.txt"
          grep -Fxq 'plugins/.staging/.htaccess' "$RUNNER_TEMP/cpanel-files.txt"
          grep -Fxq 'deployment/.env.example' "$RUNNER_TEMP/cpanel-files.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: AlomsEnglishCenter-cpanel
          path: dist/AlomsEnglishCenter-cpanel.zip
          if-no-files-found: error
          retention-days: 30