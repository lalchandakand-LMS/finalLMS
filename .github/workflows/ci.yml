name: Laravel CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: aloms_lms_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, ctype, fileinfo, mbstring, openssl, pdo_mysql, tokenizer, xml
          coverage: none
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: cp deployment/.env.example .env
      - run: php artisan key:generate --force
      - name: Run migrations
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: aloms_lms_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan migrate:fresh --force
      - name: Run tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: aloms_lms_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: vendor/bin/phpunit
      - run: php artisan route:list
      - run: npm run build

  package:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, ctype, fileinfo, mbstring, openssl, pdo_mysql, tokenizer, xml
          coverage: none
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
      - run: cp deployment/.env.example .env
      - run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
      - run: php artisan key:generate --force
      - run: php artisan config:cache
      - run: php artisan view:cache
      - run: npm ci
      - run: npm run build
      - name: Assemble and verify cPanel ZIP
        run: |
          mkdir -p "$RUNNER_TEMP/cpanel-package" dist
          rsync -a \
            --exclude='database/*.sqlite' \
            --exclude='storage/logs/*' \
            --exclude='storage/framework/cache/data/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            --exclude='storage/framework/testing/*' \
            --exclude='bootstrap/cache/*.php' \
            --exclude='tests' \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='dist' \
            app artisan bootstrap config database deployment public resources routes storage vendor composer.json composer.lock README.md \
            "$RUNNER_TEMP/cpanel-package/"
          (cd "$RUNNER_TEMP/cpanel-package" && zip -qr "$GITHUB_WORKSPACE/dist/AlomsEnglishCenter-cpanel.zip" .)
          unzip -t dist/AlomsEnglishCenter-cpanel.zip
          unzip -Z1 dist/AlomsEnglishCenter-cpanel.zip > "$RUNNER_TEMP/cpanel-files.txt"
          ! grep -Eq '(^|/)(\.env|database\.sqlite|laravel\.log|\.git)(/|$)' "$RUNNER_TEMP/cpanel-files.txt"
          grep -Fxq 'public/index.php' "$RUNNER_TEMP/cpanel-files.txt"
          grep -Fxq 'vendor/autoload.php' "$RUNNER_TEMP/cpanel-files.txt"
          grep -Fxq 'deployment/.env.example' "$RUNNER_TEMP/cpanel-files.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: AlomsEnglishCenter-cpanel
          path: dist/AlomsEnglishCenter-cpanel.zip
          if-no-files-found: error
          retention-days: 30