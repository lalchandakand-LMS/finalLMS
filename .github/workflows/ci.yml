name: Laravel CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: aloms_lms_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, ctype, fileinfo, mbstring, openssl, pdo_mysql, tokenizer, xml
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --strict
      - run: npm ci
      - run: cp deployment/.env.example .env
      - run: php artisan key:generate --force
      - name: Run migrations
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: aloms_lms_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan migrate --force
      - name: Run tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: aloms_lms_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: vendor/bin/phpunit
      - run: php artisan route:list
      - run: npm run build

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, ctype, fileinfo, mbstring, openssl, pdo_mysql, tokenizer, xml
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: cp deployment/.env.example .env
      - run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
      - run: php artisan key:generate --force
      - run: npm ci
      - run: npm run build
      - name: Create and verify cPanel ZIP
        run: |
          mkdir -p dist
          zip -qr dist/AlomsEnglishCenter-cpanel.zip app artisan bootstrap config database deployment public resources routes storage composer.json composer.lock README.md
          unzip -t dist/AlomsEnglishCenter-cpanel.zip
          if unzip -Z1 dist/AlomsEnglishCenter-cpanel.zip | grep -Ex '\.env'; then exit 1; fi
          test -f dist/AlomsEnglishCenter-cpanel.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AlomsEnglishCenter-cpanel
          path: dist/AlomsEnglishCenter-cpanel.zip
          if-no-files-found: error
          retention-days: 30