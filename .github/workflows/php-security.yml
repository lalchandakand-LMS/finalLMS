name: PHP Security Scan

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep PHP security rules
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check semgrep

      - name: Scan PHP application and plugin code
        run: >-
          semgrep scan
          --config p/php
          --config p/security-audit
          --include '*.php'
          --exclude vendor
          --exclude node_modules
          --exclude storage
          --exclude bootstrap/cache
          --error
          --metrics=off
